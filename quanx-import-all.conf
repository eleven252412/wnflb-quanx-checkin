# 导入后：
# 1) 登录福利吧网页抓 cookie
# 2) 登录 6SQ 网页并打开签到页抓 cookie
# 3) 登录哈士奇网站并打开会员中心或签到页抓 cookie
# 4) 打开中国移动 APP 的签到/心愿金页面抓 QWHD 会话
# 5) 登录 glados.cloud 或 railgun.info 并打开登录后页面抓 Cookie
# 6) 定时任务会自动运行

